<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>IFJ26 Optimizer Debugger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1><span class="wordmark">Optimizer<span class="title-detail"> / debugger</span></span></h1>
    <div class="controls">
      <label class="ctl preset-ctl" title="Load a preset IR program">
        <span class="preset-label">Preset</span>
        <select id="preset-select">
          <option value="">—</option>
        </select>
      </label>
      <button id="optimize-btn" class="primary" title="Run the freshly built optimizer (Ctrl+Enter)">
        <span class="idle-label">Optimize</span>
        <span class="busy-label">Optimizing…</span>
      </button>
    </div>
  </header>

  <main class="panes">
    <section class="pane">
      <div class="pane-head"><span class="pane-title"><span class="pane-index">01</span> IR input</span><span class="pane-meta">Source</span></div>
      <div class="editor-wrap">
        <div id="gutter" class="gutter">1</div>
        <div class="editor-stack">
          <pre id="input-highlight" class="highlight-layer" aria-hidden="true"></pre>
          <!-- AI generated by: Codex (GPT-6.2-sol)
          Prompt: "Update the C:\Users\kostk\Documents\Programming\OptimizerDebugger to work with the new setup"
          Changes: Show the canonical write instruction in the editor example. -->
          <textarea id="input" aria-label="IR input" spellcheck="false" autocomplete="off" wrap="off"
            placeholder="# Paste IR here, or pick a preset above.&#10;.entrypoint main&#10;&#10;.func main : unit&#10;.entry 0&#10;&#10;.block 0&#10;  write string &quot;hello&quot;&#10;  ret unit"></textarea>
        </div>
      </div>
    </section>
    <section class="pane">
      <div class="pane-head">
        <span class="pane-title"><span class="pane-index">02</span> Optimized IR</span>
        <span id="stats-line"></span>
      </div>
      <div class="editor-wrap">
        <div id="output-gutter" class="gutter output-gutter" aria-hidden="true"></div>
        <div id="output" class="editor-view" tabindex="0" aria-label="Optimized IR"><span class="muted">Run Optimize to inspect the result.</span></div>
      </div>
    </section>
  </main>

  <footer id="diag" class="diag hidden">
    <div class="diag-head">
      <span id="diag-title">Diagnostics</span>
      <button id="diag-close" title="Hide diagnostics">×</button>
    </div>
    <pre id="diag-body"></pre>
  </footer>

  <script src="app.js"></script>
</body>
</html>
